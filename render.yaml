services:
  - type: web
    name: aternos-eagler-wss-proxy
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ATERNOS_HOST
        value: windowsTw.aternos.me
      - key: ATERNOS_FALLBACK_PORT
        value: "49864"
